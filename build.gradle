plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = mod_version
group = mod_group_id

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = uri("${rootDir}/.gradle-local-maven") }
    mavenLocal {
        metadataSources {
            gradleMetadata()
            mavenPom()
            artifact()
        }
    }
    mavenCentral()
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged.*'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    components {
        withModule('net.neoforged:neoform') {
            allVariants {
                withDependencies {
                    removeAll { it.group == 'net.neoforged' && it.name == 'minecraft-dependencies' }
                }
            }
        }
    }

    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "com.mojang:brigadier:1.3.10"
    implementation "com.mojang:authlib:6.0.54"
    implementation "com.mojang:datafixerupper:8.0.16"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.google.guava:guava:32.1.2-jre"
    implementation "com.google.guava:failureaccess:1.0.1"
    implementation "com.ibm.icu:icu4j:73.2"
    implementation "com.mojang:blocklist:1.0.10"
    implementation "com.mojang:logging:1.2.7"
    implementation "com.mojang:text2speech:1.17.9"
    implementation "commons-codec:commons-codec:1.16.0"
    implementation "com.github.oshi:oshi-core:6.4.10"
    implementation "commons-io:commons-io:2.15.1"
    implementation "commons-logging:commons-logging:1.2"
    implementation "it.unimi.dsi:fastutil:8.5.12"
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"
    implementation "org.joml:joml:1.10.5"
    implementation "io.netty:netty-buffer:4.1.97.Final"
    implementation "io.netty:netty-common:4.1.97.Final"
    implementation "io.netty:netty-transport:4.1.97.Final"
    implementation "io.netty:netty-transport-classes-epoll:4.1.97.Final"
    implementation "io.netty:netty-codec:4.1.97.Final"
    implementation "io.netty:netty-handler:4.1.97.Final"
    implementation "io.netty:netty-resolver:4.1.97.Final"
    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "org.apache.httpcomponents:httpclient:4.5.13"
    implementation "org.apache.httpcomponents:httpcore:4.4.16"
    implementation "org.apache.logging.log4j:log4j-api:2.22.1"
    implementation "org.apache.logging.log4j:log4j-core:2.22.1"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:2.22.1"
    implementation "org.lwjgl:lwjgl:3.3.3"
    implementation "org.lwjgl:lwjgl-freetype:3.3.3"
    implementation "org.lwjgl:lwjgl-glfw:3.3.3"
    implementation "org.lwjgl:lwjgl-jemalloc:3.3.3"
    implementation "org.lwjgl:lwjgl-openal:3.3.3"
    implementation "org.lwjgl:lwjgl-opengl:3.3.3"
    implementation "org.lwjgl:lwjgl-stb:3.3.3"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3"
    implementation "org.lz4:lz4-java:1.8.0"
    implementation "org.slf4j:slf4j-api:2.0.9"
    runtimeOnly "org.lwjgl:lwjgl:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-freetype:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-jemalloc:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-openal:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-windows"

    compileOnly "maven.modrinth:emi:${emi_version}+neoforge"
    runtimeOnly "maven.modrinth:emi:${emi_version}+neoforge"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    from('src/generated/resources') {
        exclude 'data/me/trim_material/**'
        exclude 'data/me/trim_pattern/**'
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

