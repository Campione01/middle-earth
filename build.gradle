tasks.named('createMinecraftArtifacts').configure {
    dependsOn tasks.named('patchNeoFormArtifactManifest')
}

def findCachedRuntimeJar = { String group, String artifact, String version, String classifier = null ->
    def moduleRoot = file("${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/${group}/${artifact}/${version}")
    if (!moduleRoot.exists()) {
        return null
    }
    def jarName = classifier == null ? "${artifact}-${version}.jar" : "${artifact}-${version}-${classifier}.jar"
    def matches = fileTree(moduleRoot) {
        include "**/${jarName}"
    }.files
    return matches.isEmpty() ? null : matches.first().absolutePath
}

