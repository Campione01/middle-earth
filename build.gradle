tasks.register('patchDataLegacyClasspath') {
    dependsOn tasks.named('prepareDataRun')
    doLast { patchLegacyClasspath('data') }
}

tasks.register('patchClientLegacyClasspath') {
    dependsOn tasks.named('prepareClientRun')
    doLast { patchLegacyClasspath('client') }
}

tasks.register('patchServerLegacyClasspath') {
    dependsOn tasks.named('prepareServerRun')
    doLast { patchLegacyClasspath('server') }
}

tasks.named('runData').configure { dependsOn tasks.named('patchDataLegacyClasspath') }
tasks.named('runClient').configure { dependsOn tasks.named('patchClientLegacyClasspath') }
tasks.named('runServer').configure { dependsOn tasks.named('patchServerLegacyClasspath') }

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
