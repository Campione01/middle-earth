                'commons-logging\\:commons-logging\\:1.2':
                        findCachedJar('commons-logging', 'commons-logging', '1.2'),
                'it.unimi.dsi\\:fastutil\\:8.5.12':
                        findCachedJar('it.unimi.dsi', 'fastutil', '8.5.12'),
                'net.java.dev.jna\\:jna\\:5.14.0':
